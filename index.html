<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calendario Kings League – Embed</title>
  <style>
    :root{
      --bg:#000;--surface:#1a1a1a;--surface-day:#121212;
      --accent:#ff6300;--text:#fff;--text-muted:#888;--text-old:#6d6d6d;
      --radius:6px;--gap:4px;
    }

    /* === NASCONDI QUALSIASI SCROLLBAR DELLA PAGINA (wrapper esterno) === */
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden !important;
    }

    /* === NASCONDI LE SCROLLBAR DELL’IFRAME === */
    body {
      background: var(--bg);
    }
    .hide-scrollbar {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    .hide-scrollbar iframe {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      border: none; overflow: auto;
    }
    .hide-scrollbar iframe::-webkit-scrollbar { display: none; width:0; height:0; }
    .hide-scrollbar iframe { scrollbar-width: none; -ms-overflow-style: none; }

    /* === QUI COMINCIA IL CALENDARIO PROPRIO DETTO === */
    #calendario {
      max-width:600px; margin: 14px auto;
      overflow-x: auto;    /* serve per scroll orizzontale */
      overflow-y: hidden;  /* blocca scroll verticale */
      scrollbar-width: none;    /* Firefox */
      -ms-overflow-style: none; /* IE10+ */
    }
    /* nascondi WebKit scrollbar */
    #calendario::-webkit-scrollbar { display: none; width:0; height:0; }

    .day-card{background:var(--surface-day);border-radius:var(--radius);padding:10px;margin-bottom:16px;}
    .day-title{display:inline-block;padding:2px 9px;border:1px solid var(--accent);border-radius:6px;font-size:12px;font-weight:600;color:var(--accent);margin-bottom:8px;}
    .match{background:var(--surface);border-radius:var(--radius);padding:10px 8px 6px;margin-bottom:var(--gap);display:flex;align-items:center;gap:4px;flex-wrap:nowrap;}
    .match:last-child{margin-bottom:0;}
    .time{display:flex;flex-direction:column;min-width:67px;font-size:10px;line-height:1.1;color:var(--text-muted);}
    .team{display:flex;align-items:center;gap:2px;flex:0 0 auto;}
    .team img{width:20px;height:20px;object-fit:contain;}
    .team .code{font-size:12px;white-space:nowrap;}
    .team.winner .code{color:var(--accent);}
    .score{font-size:15px;font-weight:700;white-space:nowrap;margin:0 4px;}
    .score .dash{color:var(--text-old);}
    .vs{margin:0 2px;color:#aaa;font-weight:400;}
    .status{margin-left:auto;font-size:10px;font-weight:600;white-space:nowrap;}
    .status.old{color:var(--text-old);}
    @media(max-width:480px){
      .time{font-size:8px;min-width:58px;}
      .status{font-size:8px;}
      .team img{width:16px;height:16px;}
      .team .code{font-size:10px;}
      .score{font-size:13px;}
    }
  </style>
</head>
<body>

  <!-- Wrapper che nasconde scrollbars dell'iframe -->
  <div class="hide-scrollbar">
    <iframe
      src="about:blank"
      id="innerFrame"
      scrolling="yes"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Il vero contenuto viene iniettato dentro l'iframe via JavaScript -->
  <script>
    // Carica lo stesso HTML di calendar5/index.html dentro l'iframe per applicare il CSS di cui sopra
    fetch('https://francescacaleandro.github.io/calendar5/index.html')
      .then(r=>r.text())
      .then(html=>{
        const doc = document.getElementById('innerFrame').contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();
      });
  </script>

</body>
</html>
